<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Panel del profesor | Aprende Español con José Nogues</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="stylesheet" href="styles.css?v=20260907">
<script>if(localStorage.getItem('jn_theme')==='dark')document.documentElement.setAttribute('data-theme','dark');</script>
<style>
body{padding:40px 24px}
.panel-wrap{max-width:1100px;margin:0 auto}
.panel-header{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:28px;flex-wrap:wrap}
.panel-header h1{font-size:28px}
.panel-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-bottom:28px}
.panel-stat{background:var(--card-bg);border:1px solid var(--border);border-radius:14px;padding:16px 18px}
.panel-stat .n{font-family:var(--font-head);font-size:26px;font-weight:700;color:var(--primary-dark)}
.panel-stat .l{font-size:13px;color:var(--muted)}
.panel-levels{display:flex;flex-wrap:wrap;gap:5px}
.panel-level-chip{display:inline-block;background:var(--tint);color:var(--primary-dark);font-size:12px;font-weight:700;padding:2px 8px;border-radius:10px}
.panel-lang-label{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;margin-right:4px}
.panel-empty{color:var(--muted);font-size:14.5px}
.panel-flag{display:inline-block;background:#FFF3A3;color:#8a5b0a;font-size:11px;font-weight:700;padding:2px 8px;border-radius:10px;margin-left:6px;white-space:nowrap}
[data-theme="dark"] .panel-flag{background:#3a2c0d;color:#f2c94c}
.panel-course-chip{display:inline-block;background:var(--tint);color:var(--primary-dark);font-size:12px;font-weight:600;padding:2px 9px;border-radius:10px;white-space:nowrap}
.panel-course-chip b{font-weight:800;font-variant-numeric:tabular-nums}
.panel-course-chip.done{background:#DFF2E4;color:#1c6b38}
[data-theme="dark"] .panel-course-chip.done{background:#16301f;color:#7fd6a0}
.panel-link{background:var(--card-bg);border:1px solid var(--border);border-radius:14px;padding:20px 22px;margin-bottom:28px}
.panel-link h2{font-size:19px;margin-bottom:4px}
.panel-link > p{color:var(--muted);font-size:14.5px;margin-bottom:16px}
.panel-link-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-bottom:14px}
.panel-link-row label{display:block;font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.panel-link-row select{width:100%;margin-top:5px;padding:9px 11px;border-radius:10px;border:1px solid var(--border);background:var(--card-bg);color:var(--text);font-family:var(--font-body);font-size:15px;font-weight:600}
.panel-link-out{display:flex;gap:10px;flex-wrap:wrap}
#link-url{flex:1;min-width:240px;padding:11px 13px;border-radius:10px;border:1px solid var(--border);background:var(--tint);color:var(--text);font-family:var(--font-body);font-size:14px}
#link-copy{white-space:nowrap}
.panel-gate{position:fixed;inset:0;background:rgba(35,44,79,.85);display:flex;align-items:center;justify-content:center;z-index:999;padding:20px}
.panel-gate-box{background:var(--card-bg);border-radius:18px;padding:32px;max-width:360px;width:100%;text-align:center}
.panel-gate-box h3{margin-bottom:10px}
.panel-gate-box p{color:var(--muted);font-size:14.5px;margin-bottom:18px}
.panel-gate-input{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--border);font-size:16px;margin-bottom:12px;font-family:var(--font-body)}
.panel-gate-error{color:#b3261e;font-size:13.5px;min-height:18px;margin-top:6px}
#panel-content{display:none}
</style>
</head>
<body>
<div class="panel-gate" id="panel-gate">
<div class="panel-gate-box">
<i class="ti ti-lock" style="font-size:32px;color:var(--primary)"></i>
<h3 style="margin-top:10px">Panel del profesor</h3>
<p>Solo para José. Escribe la contraseña para entrar.</p>
<input type="password" class="panel-gate-input" id="panel-gate-input" placeholder="Contraseña" autocomplete="off">
<button class="button button-primary" id="panel-gate-btn" style="width:100%">Entrar</button>
<p class="panel-gate-error" id="panel-gate-error"></p>
</div>
</div>

<div class="panel-wrap" id="panel-content">
<div class="panel-header">
<h1><i class="ti ti-chart-bar" aria-hidden="true"></i> Progreso de tus alumnos</h1>
<button class="button button-secondary button-sm" id="panel-refresh"><i class="ti ti-refresh"></i> Actualizar</button>
</div>

<div class="panel-link">
<h2><i class="ti ti-link" aria-hidden="true"></i> Mandar deberes</h2>
<p>Elige el curso y el paso, copia el enlace y pégaselo al alumno por Preply.</p>
<div class="panel-link-row">
<label>Idioma del alumno
<select id="link-lang"><option value="es">Español</option><option value="it">Italiano</option><option value="en">English</option></select>
</label>
<label>Curso
<select id="link-course"><option>Cargando...</option></select>
</label>
<label>Paso
<select id="link-step"></select>
</label>
</div>
<div class="panel-link-out">
<input type="text" id="link-url" readonly>
<button class="button button-primary" id="link-copy">Copiar</button>
</div>
</div>

<div class="panel-stats" id="panel-stats"></div>

<div class="table-wrap"><table>
<thead><tr><th>Email</th><th>Visitas</th><th>Ejercicios hechos</th><th>Cursos</th><th>Niveles superados</th><th>Última actividad</th></tr></thead>
<tbody id="panel-table-body"></tbody>
</table></div>
<p class="panel-empty" id="panel-loading">Cargando...</p>
</div>

<script>
// Puerta de contraseña: script clásico (no módulo) a propósito, para que
// funcione siempre aunque Firebase tarde en cargar o no cargue.
(function(){
  var PANEL_PASSWORD = "Nogues2026";
  var UNLOCK_KEY = "jn_panel_unlocked";
  var gate = document.getElementById('panel-gate');
  var gateInput = document.getElementById('panel-gate-input');
  var gateBtn = document.getElementById('panel-gate-btn');
  var gateError = document.getElementById('panel-gate-error');
  var content = document.getElementById('panel-content');

  function unlock(){
    gate.style.display = 'none';
    content.style.display = 'block';
    sessionStorage.setItem(UNLOCK_KEY, 'true');
    document.dispatchEvent(new CustomEvent('jn-panel-unlocked'));
    // Si firebase-panel.js no llega a cargar (bloqueado, sin red...) nunca
    // marca window.jnPanelHandled, así que avisamos en vez de dejar
    // "Cargando..." para siempre.
    setTimeout(function(){
      if(!window.jnPanelHandled){
        document.getElementById('panel-loading').textContent = 'No se ha podido conectar con la base de datos. Revisa tu conexión a internet y actualiza la página.';
      }
    }, 12000);
  }

  function tryUnlock(){
    if(gateInput.value === PANEL_PASSWORD){
      gateError.textContent = '';
      unlock();
    } else {
      gateError.textContent = 'Contraseña incorrecta.';
    }
  }

  gateBtn.addEventListener('click', tryUnlock);
  gateInput.addEventListener('keydown', function(e){ if(e.key === 'Enter') tryUnlock(); });

  if(sessionStorage.getItem(UNLOCK_KEY) === 'true'){
    unlock();
  } else {
    gateInput.focus();
  }
})();

// Generador de enlaces de deberes. Los cursos se leen de la propia web
// (ejercicios-XX.html), no se copian aquí: así no se pueden desactualizar.
(function(){
  var langSel = document.getElementById('link-lang');
  var courseSel = document.getElementById('link-course');
  var stepSel = document.getElementById('link-step');
  var urlBox = document.getElementById('link-url');
  var copyBtn = document.getElementById('link-copy');
  var base = location.href.replace(/panel-profesor\.html.*$/, '');
  var cache = {};
  var courses = [];

  function loadCourses(lang){
    if(cache[lang]) return Promise.resolve(cache[lang]);
    return fetch('ejercicios-' + lang + '.html')
      .then(function(r){ return r.text(); })
      .then(function(html){
        var i = html.indexOf('\n  courses: ');
        var j = html.indexOf(',\n  topics: {', i);
        if(i < 0 || j < 0) throw new Error('sin cursos');
        cache[lang] = JSON.parse(html.slice(i + 12, j));
        return cache[lang];
      });
  }

  function fillSteps(){
    var c = courses[courseSel.selectedIndex];
    if(!c) return;
    var html = '<option value="">Todo el curso (sigue donde lo dejó)</option>';
    c.steps.forEach(function(st, i){
      html += '<option value="' + (i + 1) + '">' + (i + 1) + '. ' + st.title + '</option>';
    });
    stepSel.innerHTML = html;
    build();
  }

  function build(){
    var c = courses[courseSel.selectedIndex];
    if(!c){ urlBox.value = ''; return; }
    var url = base + 'ejercicios-' + langSel.value + '.html?curso=' + c.key;
    if(stepSel.value) url += '&paso=' + stepSel.value;
    urlBox.value = url;
  }

  function refresh(){
    courseSel.innerHTML = '<option>Cargando...</option>';
    stepSel.innerHTML = '';
    urlBox.value = '';
    loadCourses(langSel.value).then(function(list){
      courses = list;
      courseSel.innerHTML = list.map(function(c){
        return '<option>' + c.name + ' (' + c.steps.length + ' pasos)</option>';
      }).join('');
      fillSteps();
    }).catch(function(){
      courseSel.innerHTML = '<option>No se han podido leer los cursos</option>';
    });
  }

  langSel.addEventListener('change', refresh);
  courseSel.addEventListener('change', fillSteps);
  stepSel.addEventListener('change', build);
  copyBtn.addEventListener('click', function(){
    if(!urlBox.value) return;
    urlBox.select();
    var done = function(){
      copyBtn.textContent = 'Copiado';
      setTimeout(function(){ copyBtn.textContent = 'Copiar'; }, 1500);
    };
    if(navigator.clipboard) navigator.clipboard.writeText(urlBox.value).then(done, done);
    else { try { document.execCommand('copy'); } catch(e){} done(); }
  });

  refresh();
})();
</script>
<script type="module" src="firebase-panel.js?v=20260906"></script>
</body>
</html>
