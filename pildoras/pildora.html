<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:'Nunito';font-weight:400 800;src:url("REPO/fuentes/nunito-latin.woff2") format("woff2")}
@font-face{font-family:'Caveat';font-weight:700;src:url("REPO/fuentes/caveat-latin.woff2") format("woff2")}
:root{--violeta:#4b5894;--violeta-osc:#3A4570;--lila:#6a5fc0;--tinta:#2a2f45;--gris:#6b6f80;
  --verde:#2f9e6b;--rojo:#d4574e;--oro:#f2ab27;--papel:#faf8f4}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:540px;height:960px;overflow:hidden;background:var(--papel);font-family:Nunito,sans-serif;color:var(--tinta)}
#grad{position:absolute;inset:0;background:linear-gradient(135deg,#3A4570 0%,#4b5894 55%,#6a5fc0 100%);opacity:0}
#formas{position:absolute;inset:0;pointer-events:none}
#formas svg{position:absolute;overflow:visible}
#formas .f{fill:none;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
.escena{position:absolute;inset:0;opacity:0}
.escena.degradado{color:#fff}
[data-cue]{opacity:0;will-change:transform,opacity}
#marca{position:absolute;left:0;right:0;justify-content:center;top:30px;display:flex;align-items:center;gap:10px;font-weight:700;font-size:15px;color:var(--gris);z-index:5}
#marca img{width:38px;height:38px}
#marca b{font-family:Caveat;font-size:22px;color:var(--violeta)}
#avance{position:absolute;left:0;bottom:0;height:5px;background:var(--lila);z-index:6}
#subt{position:absolute;left:24px;right:24px;top:690px;justify-content:center;z-index:5;
  background:rgba(255,255,255,.96);border-radius:16px;padding:11px 22px;font-size:25px;font-weight:800;line-height:1.35;
  box-shadow:0 6px 24px rgba(40,40,80,.16);display:flex;align-items:center;gap:12px;text-align:center}
#subt img{width:30px;height:20px;border-radius:3px;flex:none}
#subt.es span{color:var(--violeta);font-weight:800}
#subt i{font-style:normal;border-radius:5px}
#subt i.on{background:var(--oro);color:#2a1f00;box-shadow:0 0 0 3px var(--oro)}
.cierre-emo{top:330px}
.gancho-txt{position:absolute;left:0;right:0;top:185px;text-align:center;color:#fff;font-size:46px;font-weight:800}
.gancho-txt.abajo{top:395px}
.alerta{position:absolute;left:50%;top:585px;width:220px;margin-left:-110px;text-align:center;background:var(--rojo);color:#fff;
  font-size:32px;font-weight:800;padding:8px 0;border-radius:999px;box-shadow:0 10px 24px rgba(0,0,0,.25)}
.palabra.chica{font-size:92px;top:200px}
/* dibujos */
svg[data-fx="draw"] path{fill:none;stroke-linecap:round;stroke-linejoin:round}
.garabato{display:block;width:240px;height:22px;margin:-6px auto 0}
.garabato path{stroke:var(--oro);stroke-width:6}
.flecha-curva{position:absolute;left:600px;top:262px;width:90px;height:110px}
.flecha-curva path{stroke:var(--lila);stroke-width:5}
.rodeado{position:relative}
.rodeo{position:absolute;left:-14px;top:-14px;width:calc(100% + 28px);height:calc(100% + 28px);overflow:visible}
.rodeo path{stroke:var(--rojo);stroke-width:4}
.estrellas{position:absolute;left:0;top:0;width:0;height:0}
.estrellas i{position:absolute;display:block}
/* piezas (vertical 540x960) */
.etiqueta{position:absolute;left:0;right:0;top:110px;text-align:center;font-family:Caveat;font-size:50px;color:var(--violeta)}
.garabato{width:200px}
.tarjeta{position:absolute;left:30px;right:30px;background:#fff;border-radius:22px;box-shadow:0 10px 30px rgba(40,40,90,.12);border:2px solid #ecebf3}
.par{top:250px;display:flex;align-items:center;justify-content:center;gap:14px;padding:18px 20px;font-size:38px;font-weight:700}
.par img{width:44px;height:30px;border-radius:4px;box-shadow:0 0 0 1px rgba(0,0,0,.08)}
.es-w{color:var(--violeta);font-weight:800}
.igual{color:var(--gris)}
.emo{font-size:52px;line-height:1}
.grande-emo{font-size:76px}
.trad{font-size:28px;color:var(--verde);font-weight:800}
.nota-mano{position:absolute;left:0;right:0;top:385px;text-align:center;font-family:Caveat;font-size:46px;color:var(--rojo)}
.nota-mano.abajo{top:545px;color:var(--verde)}
.marca{background:linear-gradient(transparent 58%,rgba(242,171,39,.55) 58%) no-repeat;background-size:0% 100%;padding:0 4px}
.frase{top:360px;display:flex;align-items:center;gap:16px;padding:20px 22px;font-size:31px;font-weight:600;line-height:1.3}
.frase img{width:44px;height:30px;border-radius:4px;flex:none;box-shadow:0 0 0 1px rgba(0,0,0,.08)}
.frase b{color:var(--verde)}
.emo-fila{position:absolute;left:0;right:0;top:245px;text-align:center;font-size:62px;letter-spacing:10px}
.sello{position:absolute;width:62px;height:62px;border-radius:50%;display:grid;place-items:center;font-size:38px;font-weight:800;color:#fff}
.sello.si{background:var(--verde);left:462px;top:330px}
.bocadillo{position:absolute;left:60px;right:60px;top:420px;text-align:center;background:var(--violeta);color:#fff;font-size:40px;font-weight:800;
  padding:18px 10px;border-radius:26px;box-shadow:0 12px 30px rgba(75,88,148,.3)}
.bocadillo::after{content:"";position:absolute;bottom:-18px;left:70px;border:12px solid transparent;border-top:18px solid var(--violeta)}
/* gancho */
.cinta{position:absolute;left:50%;top:95px;transform:translateX(-50%);background:var(--oro);color:#3A2a00;font-weight:800;font-size:20px;
  padding:8px 20px;border-radius:999px;letter-spacing:.5px;text-transform:uppercase;white-space:nowrap}
.cinta[data-cue]{left:0;right:0;margin:0 auto;width:max-content;transform:none}
.capsula{position:absolute;left:170px;top:290px;width:200px;height:90px}
.cap-a,.cap-b{position:absolute;top:0;width:100px;height:90px}
.cap-a{left:0;background:#ffe9b0;border-radius:45px 0 0 45px}
.cap-b{right:0;background:var(--oro);border-radius:0 45px 45px 0}
.palabra{position:absolute;left:0;right:0;top:240px;text-align:center;font-family:Caveat;font-size:130px;color:#fff;line-height:1}
.emoji-dudas{position:absolute;left:0;right:0;top:465px;text-align:center;font-size:72px;letter-spacing:6px}
.globo{position:absolute;background:#fff;color:var(--violeta-osc);font-weight:800;font-size:30px;padding:8px 20px;border-radius:22px;box-shadow:0 10px 24px rgba(0,0,0,.18)}
.globo::after{content:"";position:absolute;bottom:-12px;left:18px;border:8px solid transparent;border-top:12px solid #fff}
.gq1{left:120px;top:430px}.gq2{right:115px;top:470px}
/* cierre */
.resumen{position:absolute;left:0;right:0;top:190px;text-align:center;font-size:56px;font-weight:800;color:#fff}
.resumen.r2{top:290px}
.r-es{font-family:Caveat;font-size:84px;color:#ffe9b0}
.g-fin{left:50%;top:415px;transform-origin:center;margin-left:-160px;width:320px;white-space:nowrap;text-align:center}
.logo-fin{position:absolute;left:50%;top:470px;width:210px;margin-left:-105px}
.mas{position:absolute;left:0;right:0;top:640px;text-align:center;color:rgba(255,255,255,.9);font-weight:700;font-size:22px}
</style></head>
<body>
<div id="grad"></div>
<div id="formas"></div>
<div id="marca"><img src="REPO/icono.png" alt=""><span>Aprende español con <b>José</b></span></div>
ESCENAS
<div id="subt"><img alt=""><span></span></div>
<div id="avance"></div>
<script>
const TL = TIMELINE;
const clamp=(x)=>Math.max(0,Math.min(1,x));
const easeOut=(p)=>1-Math.pow(1-p,3);
const easeBack=(p)=>{const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(p-1,3)+c1*Math.pow(p-1,2)};
const DUR={openL:.5,openR:.5,pop:.4,up:.4,slide:.45,write:1.1,stamp:.3,mark:.45,grow:.7,draw:.6,wobble:.9};
const COL=['#6a5fc0','#f2ab27','#2f9e6b','#d4574e','#8891C4'];
// formas sueltas que flotan (círculo, triángulo, cruz, garabato, estrella, rombo)
const FORMAS=[
 ['<circle cx="20" cy="20" r="16"/>',30,170,COL[0]],
 ['<path d="M20 4 L36 34 L4 34 Z"/>',470,150,COL[1]],
 ['<path d="M20 4 V36 M4 20 H36"/>',475,600,COL[2]],
 ['<path d="M2 20 C 10 4, 18 36, 26 20 S 42 4, 50 20"/>',20,620,COL[4]],
 ['<path d="M20 2 L25 15 L38 16 L28 25 L31 38 L20 31 L9 38 L12 25 L2 16 L15 15 Z"/>',60,860,COL[1]],
 ['<path d="M20 2 L38 20 L20 38 L2 20 Z"/>',450,860,COL[3]],
];
const capa=document.getElementById('formas');
const formas=FORMAS.map(([d,x,y,c],i)=>{const s=document.createElementNS('http://www.w3.org/2000/svg','svg');
  s.setAttribute('viewBox','0 0 52 40');s.setAttribute('width',52);s.setAttribute('height',40);
  s.innerHTML=d.replace('/>',` class="f" stroke="${c}"/>`);capa.appendChild(s);return {s,x,y,i}});
// ráfagas de estrellitas
document.querySelectorAll('[data-fx="burst"]').forEach(b=>{b.style.left=b.dataset.x+'px';b.style.top=b.dataset.y+'px';
  for(let k=0;k<22;k++){const i=document.createElement('i');const sz=8+(k*7)%12;
    i.style.width=i.style.height=sz+'px';i.style.background=COL[k%5];
    i.style.borderRadius=k%3===0?'50%':(k%3===1?'2px':'0');if(k%3===2)i.style.clipPath='polygon(50% 0,100% 100%,0 100%)';
    i.dataset.a=(k/22)*Math.PI*2+(k%4)*.2;i.dataset.v=180+(k*53)%160;b.appendChild(i)}});
// longitudes de los trazos dibujados
document.querySelectorAll('svg[data-fx="draw"] path').forEach(p=>{const l=p.getTotalLength();p.dataset.l=l;p.style.strokeDasharray=l});
const els=[...document.querySelectorAll('[data-cue]')];
const escenas=TL.escenas.map(e=>({...e,el:document.getElementById('e-'+e.id)}));
const subt=document.getElementById('subt'), subtTxt=subt.querySelector('span'), subtImg=subt.querySelector('img');
const marca=document.getElementById('marca'), grad=document.getElementById('grad');
function render(t){
  let g=0;
  for(const e of escenas){
    const fi=e.ini<=0?1:clamp((t-e.ini)/.12), fo=clamp((e.fin-t)/.12), o=Math.min(fi,fo);
    e.el.style.opacity=o; e.el.style.visibility=o>0?'visible':'hidden';
    const golpe=e.ini<=0?0:(1-easeOut(clamp((t-e.ini)/.3)))*.07, lento=clamp((t-e.ini)/(e.fin-e.ini))*.035;
    e.el.style.transform=`scale(${1+golpe+lento})`;
    if(e.el.classList.contains('degradado'))g=Math.max(g,o);
  }
  grad.style.opacity=g; marca.style.opacity=1-g;
  formas.forEach(({s,x,y,i})=>{const a=t*.6+i*1.7;
    s.style.left=(x+Math.cos(a)*10)+'px';s.style.top=(y+Math.sin(a*1.2)*12)+'px';
    s.style.transform=`rotate(${Math.sin(t*.4+i)*25+t*(i%2?8:-8)}deg)`;
    s.querySelector('.f').style.stroke=g>.5?'rgba(255,255,255,.45)':FORMAS[i][3]});
  for(const el of els){
    const t0=TL.cues[el.dataset.cue]+(+el.dataset.delay||0), fx=el.dataset.fx;
    const d=t-t0, p=clamp(d/(DUR[fx]||.45)), s=el.style;
    if(fx==='countdown'){const dur=TL.dur[el.dataset.cue];
      if(d<0||d>dur){s.opacity=0;continue}
      const n=3-Math.floor(d/(dur/3)), q=(d%(dur/3))/(dur/3);
      el.textContent=n; s.opacity=1-Math.max(0,(q-.8)/.2); s.transform=`scale(${.6+.4*easeBack(clamp(q*4))})`; continue}
    if(fx==='draw'){s.opacity=d>0?1:0;el.querySelectorAll('path').forEach((pa,k)=>{
        const pk=clamp(d/DUR.draw-k*.6); pa.style.strokeDashoffset=pa.dataset.l*(1-easeOut(pk))});continue}
    if(fx==='burst'){const on=d>0&&d<1.3;s.opacity=on?1:0;if(!on)continue;
      el.querySelectorAll('i').forEach(i=>{const a=+i.dataset.a,v=+i.dataset.v;
        const x=Math.cos(a)*v*d*(1-d*.35), y=Math.sin(a)*v*d*(1-d*.35)+140*d*d;
        i.style.transform=`translate(${x}px,${y}px) rotate(${d*400}deg)`;i.style.opacity=clamp(1.3-d)});continue}
    if(fx==='travel'){s.opacity=d>0?1:0;let pos=110;
      for(const [c,px] of [['l2',280],['l4',640],['l6',1000]])pos+=(px-pos)*easeOut(clamp((t-TL.cues[c])/.6));
      s.left=pos+'px';continue}
    if(fx==='openL'||fx==='openR'){s.opacity=1;const k=easeOut(p),sg=fx==='openL'?-1:1;
      s.transform=`translate(${sg*k*120}px,${k*40}px) rotate(${sg*k*35}deg)`;s.opacity=1-clamp((d-.3)/.4);continue}
    if(fx==='ya'){s.opacity=1;continue}
    if(fx==='bob'){s.opacity=easeOut(clamp(p*1.6));s.transform=`scale(${.55+.45*easeBack(p)}) translateY(${Math.sin(t*5)*6}px)`;continue}
    if(fx==='grow'){s.opacity=d>0?1:0;s.transform=`scaleX(${easeOut(p)})`;continue}
    if(fx==='mark'){s.opacity=1;s.backgroundSize=`${easeOut(p)*100}% 100%`;continue}
    if(fx==='write'){s.opacity=d>0?1:0;s.clipPath=`inset(-20% ${100-p*100}% -20% 0)`;continue}
    s.opacity=easeOut(clamp(p*1.6));
    const k=fx==='stamp'?easeOut(p):easeBack(p);
    if(fx==='pop')s.transform=`scale(${.55+.45*k})`;
    else if(fx==='wobble')s.transform=`scale(${.4+.6*easeBack(p)}) rotate(${Math.sin(d*14)*14*Math.exp(-d*3)}deg)`;
    else if(fx==='up')s.transform=`translateY(${(1-easeOut(p))*24}px)`;
    else if(fx==='slide')s.transform=`translateX(${(1-easeOut(p))*-50}px)`;
    else if(fx==='stamp')s.transform=`scale(${2.2-1.2*k}) rotate(${-14*k}deg)`;
  }
  const tr=TL.trozos.find(x=>t>=x.ini&&t<x.fin+.2&&x.text);
  if(tr){subt.style.opacity=1;
    if(subtTxt.dataset.id!==tr.id){subtTxt.dataset.id=tr.id;
      subtTxt.innerHTML=tr.sub.split(' ').map(w=>`<i>${w}</i>`).join(' ')}
    const ws=[...subtTxt.querySelectorAll('i')], tot=ws.reduce((a,w)=>a+w.textContent.length+1,0);
    let acc=0; const prog=clamp((t-tr.ini)/(tr.fin-tr.ini))*tot;
    ws.forEach(w=>{const on=prog>=acc&&prog<acc+w.textContent.length+1;acc+=w.textContent.length+1;w.className=on?'on':''});subt.className=tr.lang;subtImg.src=TL.banderas[tr.lang];subtImg.style.display=tr.lang==='es'?'block':'none'}
  else subt.style.opacity=0;
  document.getElementById('avance').style.width=(t/TL.total*100)+'%';
}
window.render=render; render(0);
</script>
</body></html>
